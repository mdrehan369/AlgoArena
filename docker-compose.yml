version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass1234
      POSTGRES_DB: algoarena
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:pass1234@db:5432/algoarena
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      IMAGE_KIT_PUBLIC_KEY: "public_HJcPdQBz+e6AzjpQHGKvX+DwxKE="
      IMAGE_KIT_PRIVATE_KEY: "private_SPYHLlC6YGYvWu0oMMcH4bjnDwM="
    ports:
      - "5000:5000"
    depends_on:
      - db
      - algoarenaKafka
    networks:
      - app-network
    volumes:
      - ./packages/db/prisma:/app/packages/db/prisma # For migrations
      - /var/run/docker.sock:/var/run/docker.sock # For backend to create more containers
  algoarenaKafka:
    image: apache/kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@algoarenaKafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://algoarenaKafka:9092,EXTERNAL://algoarenaKafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app-network
  # Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:pass1234@db:5432/algoarena
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - db
    networks:
      - app-network
  #
  # Migration runner (runs once and exits)
# ================================================================
# DATABASE MIGRATION + SEED
# ================================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: prisma

    environment:
      DATABASE_URL: postgresql://admin:pass1234@db:5432/algoarena

    depends_on:
      - db

    networks:
      - app-network

    volumes:
      - ./packages/db/prisma:/app/packages/db/prisma

    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy --schema=./packages/db/prisma/schema.prisma && cd packages/db && npm run seed"
      ]

    restart: "no"


  # ================================================================
  # PRISMA STUDIO
  # ================================================================
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: prisma

    environment:
      DATABASE_URL: postgresql://admin:pass1234@db:5432/algoarena

    depends_on:
      - db
      - migrate

    networks:
      - app-network

    ports:
      - "5555:5555"

    volumes:
      - ./packages/db/prisma:/app/packages/db/prisma

    command:
      [
        "npx",
        "prisma",
        "studio",
        "--schema=./packages/db/prisma/schema.prisma",
        "--hostname=0.0.0.0"
      ]

    restart: "no"
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
